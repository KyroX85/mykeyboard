name: Render Keep Alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/render-keepalive.yml"

permissions:
  contents: read

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: |
          status="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' https://mykeyboard-8bx0.onrender.com/health)"
          echo "Render keepalive HTTP status: ${status}"
          if [ "${status}" = "000" ] || [ "${status}" -ge 500 ]; then
            exit 1
          fi
