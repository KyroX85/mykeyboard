name: Product Lab Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 8 * * *"
    - cron: "30 15 * * *"

permissions:
  contents: read

jobs:
  product-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Run local product lab unit checks
        run: node ai-cto/scripts/test-scheduled-product-lab.js

      - name: Boot emulator and capture smoke screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell input keyevent 82 || true
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb shell settings put secure show_ime_with_hard_keyboard 1 || true
            adb shell settings put system screen_off_timeout 600000 || true
            adb shell ime enable com.example.mykeyboard/.KeyboardService || true
            adb shell ime set com.example.mykeyboard/.KeyboardService || true
            adb shell am force-stop com.example.mykeyboard || true
            adb shell am start -W -n com.example.mykeyboard/.ProductLabInputActivity
            sleep 8
            node ai-cto/product-lab/adb/system-dialog-guard.js
            adb shell input tap 540 260
            sleep 5
            adb shell dumpsys input_method | grep -E "mInputShown|mCurMethod|com.example.mykeyboard" || true
            adb shell uiautomator dump /sdcard/product-lab-window.xml || true
            adb pull /sdcard/product-lab-window.xml artifacts/product-lab-window.xml || true
            node ai-cto/product-lab/adb/system-dialog-guard.js
            mkdir -p artifacts/product-lab/screenshots
            adb exec-out screencap -p > artifacts/product-lab/screenshots/emulator-smoke.png
            test -s artifacts/product-lab/screenshots/emulator-smoke.png
            adb shell uiautomator dump /sdcard/product-lab-window-after-screenshot.xml || true
            adb pull /sdcard/product-lab-window-after-screenshot.xml artifacts/product-lab-window-after-screenshot.xml || true
            node ai-cto/product-lab/adb/system-dialog-guard.js
            ls -lh artifacts/product-lab/screenshots

      - name: Generate product lab reports
        run: node ai-cto/scripts/run-scheduled-product-lab.js

      - name: Upload product lab artifacts
        uses: actions/upload-artifact@v4
        with:
          name: product-lab-validation
          path: |
            artifacts/product-lab
            ai-cto/product-lab/reports/*.md
            ai-cto/product-lab/reports/*.txt
