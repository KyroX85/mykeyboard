name: Engineering Maintenance Worker

on:
  schedule:
    - cron: '30 1 * * *' # Daily 7:00 AM IST school-mode alert
    - cron: '0 */6 * * *' # Run every 6 hours
  push:
    branches-ignore:
      - 'cto/**'
  workflow_dispatch: # Allow manual triggers
    inputs:
      whatsapp_message:
        description: 'Optional exact WhatsApp message to send to the founder'
        required: false
        default: ''

concurrency:
  group: engineering-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Notification Secrets
        run: |
          if [ -z "${{ secrets.MAIL_USERNAME }}" ]; then echo "::warning::MAIL_USERNAME is missing; email may be skipped or fail."; fi
          if [ -z "${{ secrets.REPORT_RECIPIENT_EMAIL }}" ]; then echo "::warning::REPORT_RECIPIENT_EMAIL is missing; email may be skipped or fail."; fi
          if [ -z "${{ secrets.FOUNDER_WHATSAPP_NUMBER }}" ] && [ -z "${{ secrets.META_WHATSAPP_TO }}" ]; then echo "::warning::No founder WhatsApp recipient secret configured."; fi
          if [ -z "${{ secrets.TWILIO_ACCOUNT_SID }}" ] && [ -z "${{ secrets.META_WHATSAPP_ACCESS_TOKEN }}" ]; then echo "::warning::No outbound WhatsApp provider secret configured."; fi
        shell: bash

      - name: Install Dependencies
        run: npm install || echo "No package.json or install failed, continuing..."

      - name: Run Android Validation
        run: |
          chmod +x ./gradlew
          node ai-cto/scripts/run-android-validation.js
        shell: bash

      - name: Run Engineering Brain
        id: brain
        run: node ai-cto/brain.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run NVIDIA AI Execution Bridge
        if: always()
        run: node ai-cto/scripts/ai-execution-bridge.js --commit
        env:
          NVIDIA_DEEPSEEK_API_KEY: ${{ secrets.NVIDIA_DEEPSEEK_API_KEY }}
          NVIDIA_LLAMA_API_KEY: ${{ secrets.NVIDIA_LLAMA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Prepare Founder Email Report
        if: always()
        run: |
          if [ ! -f ENGINEERING_REPORT.md ]; then
            echo "ENGINEERING_REPORT.md was not generated in this run." > ENGINEERING_REPORT.md
          fi
          {
            echo "Founder Sir,"
            echo
            echo "School mode CTO update ready. Inniku repo check mudinjudhu."
            echo
            echo "Repository: ${{ github.repository }}"
            echo "Commit: ${{ github.sha }}"
            echo "Mode: maintain + suggest useful features. Big move panna matten without you."
            echo
            echo "CTO Report:"
            echo
            cat ENGINEERING_REPORT.md
            echo
            echo "Respectfully,"
            echo "Your CTO Agent"
          } > email_report.txt
        shell: bash

      - name: Send Engineering Report Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CTO Report - ${{ github.repository }} - ${{ github.sha }}"
          to: ${{ secrets.REPORT_RECIPIENT_EMAIL }}
          from: "CTO Agent <${{ secrets.MAIL_USERNAME }}>"
          body: file://email_report.txt
        if: always() # Send even if tests failed (the brain handles reporting)

      - name: Send Daily WhatsApp School Mode Report
        if: always()
        run: node ai-cto/scripts/send-whatsapp-report.js
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          FOUNDER_WHATSAPP_NUMBER: ${{ secrets.FOUNDER_WHATSAPP_NUMBER }}
          META_WHATSAPP_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_ACCESS_TOKEN }}
          META_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.META_WHATSAPP_PHONE_NUMBER_ID }}
          META_WHATSAPP_GRAPH_VERSION: ${{ secrets.META_WHATSAPP_GRAPH_VERSION }}
          META_WHATSAPP_TO: ${{ secrets.META_WHATSAPP_TO }}
          CTO_WHATSAPP_BODY: ${{ github.event.inputs.whatsapp_message }}
        shell: bash

      - name: Create Report and Memory PR
        if: always()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update CTO report and memory [skip ci]"
          title: "[REVIEW REQUIRED] CTO report and memory update"
          body: |
            CTO report and engineering memory generated by the scheduled maintenance run.

            This PR intentionally avoids direct pushes to the protected branch.

            Review contents:
            - ENGINEERING_REPORT.md
            - ai-cto/.brain_state.json
            - ai-cto/validation-results.json
          branch: cto/report-memory
          delete-branch: true
          add-paths: |
            ENGINEERING_REPORT.md
            ai-cto/.brain_state.json
            ai-cto/validation-results.json

  safe-autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Safe Autofix Layer
        run: node ai-cto/scripts/safe-autofix.js --apply
        shell: bash

      - name: Create Low-Risk Autofix PR
        id: low_risk_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: apply safe CTO maintenance cleanup"
          title: "[LOW-RISK] CTO safe maintenance cleanup"
          body: |
            Deterministic low-risk maintenance changes generated by the CTO safe-autofix layer.

            Allowed scopes only:
            - stale temporary file cleanup
            - documentation whitespace cleanup
            - resource XML final newline normalization

            Forbidden scopes remain blocked:
            - predictor, database, networking, privacy, lifecycle, gesture, and swipe changes
          branch: cto/low-risk-maintenance
          delete-branch: true
          add-paths: |
            README.md
            NEXT.md
            app/src/main/res/**/*.xml

      - name: Auto Merge Low-Risk PR
        if: steps.low_risk_pr.outputs.pull-request-number != ''
        run: gh pr merge "${{ steps.low_risk_pr.outputs.pull-request-number }}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
