name: Engineering Maintenance Worker

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allow manual triggers

concurrency:
  group: engineering-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit report and state back

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Secrets
        run: |
          if [ -z "${{ secrets.MAIL_USERNAME }}" ]; then echo "::error::MAIL_USERNAME is missing"; exit 1; fi
          if [ -z "${{ secrets.REPORT_RECIPIENT_EMAIL }}" ]; then echo "::error::REPORT_RECIPIENT_EMAIL is missing"; exit 1; fi
        shell: bash

      - name: Install Dependencies
        run: npm install || echo "No package.json or install failed, continuing..."

      - name: Run Engineering Tests
        run: |
          # Run tests and capture all output to log
          # Use || true to ensure the workflow continues to the brain phase on failure
          npm test > test_output.log 2>&1 || true
        shell: bash

      - name: Run Engineering Brain
        id: brain
        run: node ai-cto/brain.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Persist State and Report
        run: |
          git config --global user.name "Engineering Brain [bot]"
          git config --global user.email "engineering-brain-bot@users.noreply.github.com"
          git add ai-cto/.brain_state.json ENGINEERING_REPORT.md
          if git diff --quiet && git diff --staged --quiet; then
            echo "No engineering report changes to persist."
          else
            git commit -m "chore: update engineering state and report [skip ci]"
            git push || echo "::warning::Report push was skipped because main moved during another maintenance run."
          fi
        shell: bash

      - name: Create PR for Safe Autofixes
        if: steps.brain.outputs.autofix_available == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: apply safe engineering improvements"
          title: "Maintenance: Safe Engineering Improvements"
          body: |
            This PR contains small, safe engineering improvements identified by the maintenance worker.
            
            Refer to `ENGINEERING_REPORT.md` for details.
          branch: engineering/safe-autofix
          delete-branch: true

      - name: Prepare Founder Email Report
        if: always()
        run: |
          if [ ! -f ENGINEERING_REPORT.md ]; then
            echo "ENGINEERING_REPORT.md was not generated in this run." > ENGINEERING_REPORT.md
          fi
          {
            echo "Founder Sir,"
            echo
            echo "Your CTO maintenance review for ${{ github.repository }} is complete."
            echo
            echo "Repository: ${{ github.repository }}"
            echo "Commit: ${{ github.sha }}"
            echo
            echo "CTO Report:"
            echo
            cat ENGINEERING_REPORT.md
            echo
            echo "Respectfully,"
            echo "Your CTO Agent"
          } > email_report.txt
        shell: bash

      - name: Send Engineering Report Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CTO Report - ${{ github.repository }} - ${{ github.sha }}"
          to: ${{ secrets.REPORT_RECIPIENT_EMAIL }}
          from: "CTO Agent <${{ secrets.MAIL_USERNAME }}>"
          body: file://email_report.txt
        if: always() # Send even if tests failed (the brain handles reporting)
